<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go IM Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
    }
    section {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
    }
    h1, h2 { margin: 0 0 12px; }
    h1 { font-size: 24px; grid-column: 1 / -1; }
    h2 { font-size: 16px; }
    input, button {
      width: 100%;
      height: 38px;
      margin: 6px 0;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      border: 0;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
    }
    button.secondary { background: #475569; }
    button.ghost {
      background: #fff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .muted { color: #64748b; font-size: 13px; }
    .users button {
      text-align: left;
      background: #f8fafc;
      color: #111827;
      border: 1px solid #e5e7eb;
      font-weight: 400;
    }
    .chat {
      min-height: 460px;
      display: flex;
      flex-direction: column;
    }
    #messages {
      flex: 1;
      overflow: auto;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      background: #fafafa;
    }
    .msg {
      margin: 8px 0;
      padding: 8px 10px;
      border-radius: 8px;
      max-width: 70%;
      background: #e5e7eb;
    }
    .msg.mine {
      margin-left: auto;
      background: #dbeafe;
    }
    .msg small {
      display: block;
      color: #64748b;
      margin-top: 4px;
    }
    .send {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 8px;
      margin-top: 12px;
    }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; padding: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Go IM Demo</h1>

    <section>
      <h2>账号</h2>
      <input id="username" placeholder="用户名，例如 alice">
      <input id="nickname" placeholder="昵称，可为空">
      <input id="password" type="password" placeholder="密码，至少 6 位">
      <div class="row">
        <button onclick="register()">注册</button>
        <button class="secondary" onclick="login()">登录</button>
      </div>
      <p id="me" class="muted">未登录</p>
      <button class="ghost" onclick="loadUsers()">刷新用户</button>
      <div id="users" class="users"></div>
    </section>

    <section class="chat">
      <h2 id="chatTitle">请选择聊天对象</h2>
      <div id="messages"></div>
      <div class="send">
        <input id="content" placeholder="输入消息后回车发送" onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">发送</button>
      </div>
    </section>
  </main>

  <script>
    let token = localStorage.getItem("token") || "";
    let me = JSON.parse(localStorage.getItem("me") || "null");
    let ws = null;
    let peer = null;

    updateMe();
    if (token) {
      connectWS();
      loadUsers();
    }

    async function api(path, options = {}) {
      options.headers = options.headers || {};
      if (token) options.headers.Authorization = "Bearer " + token;
      if (options.body) options.headers["Content-Type"] = "application/json";
      const res = await fetch(path, options);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "请求失败");
      return data;
    }

    async function register() {
      const body = getAccountForm();
      try {
        await api("/api/register", { method: "POST", body: JSON.stringify(body) });
        alert("注册成功，请登录");
      } catch (err) {
        alert(err.message);
      }
    }

    async function login() {
      const body = getAccountForm();
      try {
        const data = await api("/api/login", { method: "POST", body: JSON.stringify(body) });
        token = data.token;
        me = data.user;
        localStorage.setItem("token", token);
        localStorage.setItem("me", JSON.stringify(me));
        updateMe();
        connectWS();
        loadUsers();
      } catch (err) {
        alert(err.message);
      }
    }

    async function loadUsers() {
      if (!token) return;
      try {
        const data = await api("/api/users");
        const box = document.getElementById("users");
        box.innerHTML = "";
        data.users.forEach(user => {
          const btn = document.createElement("button");
          btn.textContent = `#${user.id} ${user.nickname || user.username}`;
          btn.onclick = () => selectPeer(user);
          box.appendChild(btn);
        });
      } catch (err) {
        alert(err.message);
      }
    }

    async function selectPeer(user) {
      peer = user;
      document.getElementById("chatTitle").textContent = `正在和 ${user.nickname || user.username} 聊天`;
      const data = await api(`/api/messages?peer_id=${user.id}`);
      const box = document.getElementById("messages");
      box.innerHTML = "";
      data.messages.forEach(renderMessage);
    }

    function connectWS() {
      if (ws) ws.close();
      ws = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}`);
      ws.onmessage = event => {
        const data = JSON.parse(event.data);
        if (data.type === "chat" || data.type === "ack") {
          renderMessage(data.message);
        }
        if (data.type === "error") {
          alert(data.error);
        }
      };
      ws.onclose = () => {
        setTimeout(() => {
          if (token) connectWS();
        }, 1500);
      };
    }

    function sendMessage() {
      const input = document.getElementById("content");
      const content = input.value.trim();
      if (!peer) return alert("请先选择聊天对象");
      if (!content) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) return alert("WebSocket 未连接");

      ws.send(JSON.stringify({ type: "chat", to: peer.id, content }));
      input.value = "";
    }

    function renderMessage(message) {
      if (!message || !me) return;
      if (peer && ![message.from_id, message.to_id].includes(peer.id)) return;

      const box = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = "msg" + (message.from_id === me.id ? " mine" : "");
      div.innerHTML = `<div>${escapeHTML(message.content)}</div><small>#${message.id} ${new Date(message.created_at).toLocaleString()}</small>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function getAccountForm() {
      return {
        username: document.getElementById("username").value.trim(),
        nickname: document.getElementById("nickname").value.trim(),
        password: document.getElementById("password").value
      };
    }

    function updateMe() {
      document.getElementById("me").textContent = me ? `当前用户：#${me.id} ${me.nickname || me.username}` : "未登录";
    }

    function escapeHTML(value) {
      return value.replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch]));
    }
  </script>
</body>
</html>
